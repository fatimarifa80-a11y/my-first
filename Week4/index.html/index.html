<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Club Page</title>
</head>
<body>
    <h1>REGISTRATION PAGE</h1>
    <form>
        <label for="name">FULL NAME: </label>
        <input type="text"
        id="name">
        <br><br>
        <label for="email">EMAIL: </label>
        <input type="text"
        id="email">
        <br><br>
        <label for="phone">PHONE NUMBER: </label>
        <input
        type="tele"
        id="phone"><br><br>
        <label for="password">PASSWORD: </label>
        <input
        type="password"
        id="pass"><br><br>
        <label for="dob">DATE OF BIRTH: </label>
        <input
        type="date"
        id="dob">
        <label>
        <p><b>YEAR</b></p>
        <input
        type="radio"
        value="1">
        FIRST YEAR
        </label>
        <label>
            <input
            type="radio"
            value="2">
            SECOND YEAR
        </label>
        <p><b>SKILLS</b></p>
        <label
        input type="checkbox"
        name="skills"
        value="html">HTML</label><br>
        <label
        input type="checkbox"
        name="skills"
        value="css">CSS</label><br><br>
        <label for="message">MESSAGE: </label>
        <textarea
        id="message"
        name="message"
        rows="5"
        cols="20"></textarea><br><br>
        <button type="submit">SUBMIT</button>
    </form>
</body>
</html>
