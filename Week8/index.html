<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header class="head">
            <h2>My Dashboard</h2>
        </header>
    <aside class="side">
        <h3>Menu</h3>
        <p>Home</p>
        <p>Profile</p>
        <p>Setting</p>
        <p>Logout</p>
    </aside>
    <main class="main">
        <h2>Welcome to Dashboard</h2>
        <div class="box-container">
             <div class="box">
             <span class="icon">👤</span>
             <span>Total Users</span></div>

             <div class="box">
             <span class="icon">📊</span>
             <span>Analytics</span></div>

             <div class="box">
                <span class="icon">💰</span>
                <span>Revenue</span>
                </div>
            <div class="box">
                <span class="icon">📁</span>
                <span>Projects</span>
                </div>
            <div class="box">
                <span class="icon">🛞</span>
                <span>Settings</span>
            </div>
            <div class="box">
                <span class="icon">📩</span>
                <span>Messages</span>
            </div>
        </div>
    </main>
    <footer class="foot">
        <p>2026 My Dashboard</p>
    </footer>
    </div>
</body>
</html>
